<section class="dashboard">
  <div class="dashboard__prompt-container">
    <form class="dashboard__form">
      <input
        type="text"
        name="prompt"
        placeholder="Escribe tu consulta aquí..."
        class="dashboard__input" 
      >

      <button
        type="submit"
        class="dashboard__button"
        [class.dashboard__button--loading]="analyticsResource.isLoading()">
        {{ analyticsResource.isLoading() ? 'Generando...' : 'Generar Gráfica' }}
      </button>
    </form>
  </div>

  @if (analyticsResource.isLoading()) {
    <div class="dashboard__status dashboard__status--loading">
      <p class="dashboard__status-text">Consultando a n8n y generando reporte...</p>
    </div>
  } @else if (analyticsResource.error()) {
    <div class="dashboard__status dashboard__status--error">
      <p class="dashboard__status-text">Error al comunicarse con el flujo de n8n.</p>
    </div>
  } @else if (analyticsResource.value()) {
    <h2 class="dashboard__title">{{ reportTitle() }}</h2>

    <div class="dashboard__chart-card">
      <div
        echarts
        [options]="chartOptions()"
        class="dashboard__chart-box">
      </div>
    </div>
  }
</section>
